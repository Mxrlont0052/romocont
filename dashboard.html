<!doctype html>
<html lang="es" data-t="c">
<head>
<meta charset="utf-8">
<!-- Evita que el navegador se quede con una versión vieja cacheada -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Content Team ROMO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
/* Marca ROMO (B1g1) + medidas del sistema Apple (apple-design-research). Pirulen/Terminator no se pueden usar en web (licencia de escritorio). */
:root{
  --negro:#000; --card:#0D0D0D; --card-2:#151515; --borde:#1A1A1A; --gris:#8A8A8A;
  --blanco:#fff; --l2:rgba(255,255,255,.62); --l3:rgba(255,255,255,.34);
  --rojo:#FF0000; --rojo-suave:rgba(255,0,0,.14); --cyan:#00FFFF;
  --verde:#30D158; --naranja:#FF9230;
  --fill:rgba(120,120,128,.24); --sep:rgba(84,84,88,.6);
  --font:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --m:16px; --tap:44px;
  --spring:linear(0, 0.060 4.2%, 0.186 8.3%, 0.329 12.5%, 0.464 16.7%, 0.583 20.8%, 0.681 25.0%, 0.759 29.2%, 0.820 33.3%, 0.866 37.5%, 0.902 41.7%, 0.928 45.8%, 0.948 50.0%, 0.962 54.2%, 0.973 58.3%, 0.981 62.5%, 0.986 66.7%, 0.990 70.8%, 0.993 75.0%, 0.995 79.2%, 0.996 83.3%, 0.997 87.5%, 0.998 91.7%, 0.999 95.8%, 1);
  --snappy:linear(0, 0.059 4.2%, 0.189 8.3%, 0.342 12.5%, 0.492 16.7%, 0.624 20.8%, 0.732 25.0%, 0.817 29.2%, 0.881 33.3%, 0.927 37.5%, 0.959 41.7%, 0.980 45.8%, 0.993 50.0%, 1.000 54.2%, 1.004 58.3%, 1.006 62.5%, 1.006 66.7%, 1.006 70.8%, 1.005 75.0%, 1.004 79.2%, 1.003 83.3%, 1.002 87.5%, 1.001 91.7%, 1.001 95.8%, 1);
}
@supports not (transition-timing-function: linear(0, 1)){:root{--spring:cubic-bezier(.25,.1,.25,1);--snappy:cubic-bezier(.25,.1,.25,1)}}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--negro)}
body{background:var(--negro);color:var(--blanco);font-family:var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-size:16px;line-height:1.35;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;border:0;background:none}
button:focus{outline:none} button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 0 calc(110px + env(safe-area-inset-bottom))}

/* Barra de arriba */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) var(--m) 10px;background:rgba(0,0,0,.82);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:0 .5px 0 var(--borde)}
.top img{height:30px;display:block}
.live{display:flex;align-items:center;gap:6px;font:700 11px/1 var(--font);letter-spacing:.1em;color:var(--l2);text-transform:uppercase}
.live i{width:7px;height:7px;border-radius:50%;background:var(--naranja)}
.live.ok i{background:var(--verde);box-shadow:0 0 0 3px rgba(48,209,88,.18)}
.top-act{display:flex;gap:6px}
.ico{width:var(--tap);height:var(--tap);border-radius:50%;display:grid;place-items:center;background:var(--card-2);color:var(--blanco);transition:opacity .3s}
.ico:active{opacity:.4;transition:none}
.ico svg{width:20px;height:20px}

/* Títulos */
.page-h{padding:18px var(--m) 4px}
.kicker{font:800 12px/16px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--rojo)}
.h1{font:900 34px/38px var(--font);letter-spacing:-.01em;text-transform:uppercase;margin-top:4px}
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:28px var(--m) 10px}
.sec h2{font:800 13px/18px var(--font);letter-spacing:.12em;text-transform:uppercase}
.sec span{font:500 13px/18px var(--font);color:var(--l2)}
.sub{font:500 15px/20px var(--font);color:var(--l2)}

/* Números grandes */
.hero{margin:12px var(--m) 0;border-radius:24px;background:var(--card);box-shadow:inset 0 0 0 1px var(--borde);padding:18px 18px 16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,0,0,.28),transparent 70%);pointer-events:none}
.hero-n{font:900 64px/1 var(--font);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero-row{display:flex;gap:10px;margin-top:14px}
.hero-row > div{flex:1;min-width:0;border-radius:16px;background:var(--card-2);padding:12px}
.mini-n{font:900 28px/1 var(--font);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mini-l{font:700 10px/14px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--l2);margin-top:6px}
.bar{height:8px;border-radius:4px;background:var(--fill);overflow:hidden;margin-top:14px;display:flex}
.bar i{display:block;height:100%}

/* Alertas */
.alerts{display:flex;gap:10px;overflow-x:auto;padding:0 var(--m) 2px;scroll-snap-type:x mandatory;scroll-padding-inline:var(--m);scrollbar-width:none}
.alerts::-webkit-scrollbar{display:none}
.alert{flex:none;width:78%;max-width:320px;scroll-snap-align:start;border-radius:20px;padding:14px 16px;background:var(--rojo);color:#fff;text-align:left}
.alert.low{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--naranja)}
.alert b{display:block;font:900 20px/24px var(--font);text-transform:uppercase;letter-spacing:-.01em}
.alert small{display:block;font:700 12px/16px var(--font);letter-spacing:.08em;text-transform:uppercase;margin-top:6px;opacity:.9}
.alert.low small{color:var(--naranja)}
.alert:active{filter:brightness(.82);transition:none}

/* Tarjetas y filas */
.card{margin:0 var(--m);border-radius:20px;background:var(--card);box-shadow:inset 0 0 0 1px var(--borde);overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:var(--tap);padding:12px 16px;width:100%;text-align:left;transition:background-color .3s}
button.row:active{background:var(--card-2);transition:none}
.row + .row::before{content:"";position:absolute;top:0;right:0;left:16px;height:.5px;background:var(--sep)}
.grow{flex:1;min-width:0}
.t{font:700 16px/21px var(--font)}
.m{font:500 13px/18px var(--font);color:var(--l2)}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font:900 22px/1 var(--font);font-variant-numeric:tabular-nums;text-align:right}
.num small{display:block;font:600 11px/14px var(--font);color:var(--l2);letter-spacing:.04em;margin-top:3px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.pbar{height:5px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;border-radius:3px}
.tag{display:inline-flex;align-items:center;gap:4px;font:800 10px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;border-radius:6px;padding:4px 6px;white-space:nowrap}
.tag.red{background:var(--rojo);color:#fff} .tag.org{background:rgba(255,146,48,.16);color:var(--naranja)} .tag.ok{background:rgba(48,209,88,.14);color:var(--verde)} .tag.cy{background:rgba(0,255,255,.12);color:var(--cyan)} .tag.gr{background:var(--fill);color:var(--l2)}

/* Creadores */
.rank{width:26px;font:900 15px/1 var(--font);color:var(--l3);text-align:center;flex:none}
.rank.r1{color:var(--rojo)}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font:900 14px/1 var(--font);background:var(--card-2);box-shadow:inset 0 0 0 1.5px var(--borde)}
.quota{display:flex;gap:3px;margin-top:8px}
.quota span{flex:1;height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.quota span i{display:block;height:100%;background:var(--rojo)}
.quota span i.full{background:var(--verde)}
.role{font:600 12px/16px var(--font);color:var(--l2);margin-top:2px}
.detail-role{display:none;padding:0 16px 14px 82px;font:500 13px/19px var(--font);color:var(--l2)}
.detail-role.open{display:block}

/* Segmentado y flechas */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:980px;padding:2px;height:36px;margin:0 var(--m)}
.seg button{position:relative;z-index:1;border-radius:980px;font:700 13px/1 var(--font);letter-spacing:.02em}
.seg button:active:not([aria-pressed="true"]){opacity:.45}
.seg .th{position:absolute;top:2px;bottom:2px;left:2px;border-radius:980px;background:#3A3A3C;transition:transform .75s var(--snappy)}
.nav-mes{display:flex;align-items:center;justify-content:space-between;margin:12px var(--m) 10px}
.nav-mes b{font:800 15px/20px var(--font);text-transform:capitalize}
.arrow{width:var(--tap);height:var(--tap);border-radius:50%;background:var(--card-2);font:700 20px/1 var(--font)}
.arrow:disabled{opacity:.25}
.arrow:active{opacity:.4}

/* Buscar y filtros */
.search{display:flex;align-items:center;gap:8px;height:44px;margin:12px var(--m) 0;padding:0 14px;border-radius:14px;background:var(--card-2);color:var(--l2)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font:500 16px/22px var(--font);color:var(--blanco)}
.search input::placeholder{color:var(--l3)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px var(--m) 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;border-radius:980px;padding:0 14px;background:var(--card-2);font:700 13px/1 var(--font);display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--blanco);color:#000}
.chip:active{opacity:.45;transition:none}

/* Filas de video */
.vid-act{display:flex;gap:6px;flex:none}
.btn{border-radius:980px;min-height:var(--tap);padding:0 18px;font:800 15px/1 var(--font);letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:filter .35s,opacity .35s,background-color .35s}
.btn:active{transition:none}
.btn-red{background:var(--rojo);color:#fff;text-transform:uppercase}
.btn-red:active{filter:brightness(.82)}
.btn-red:disabled{background:var(--fill);color:var(--l3);filter:none;cursor:default}
.btn-gray{background:var(--card-2);color:var(--blanco)}
.btn-gray:active{opacity:.4}
.btn-sm{min-height:36px;padding:0 12px;font-size:13px;text-transform:none;letter-spacing:0}
.btn-wide{width:100%;min-height:52px;font-size:16px}
.fill-dots{display:flex;gap:3px;margin-top:6px}
.fill-dots i{width:16px;height:4px;border-radius:2px;background:var(--fill)}
.fill-dots i.on{background:var(--verde)}

/* Data para Peter */
.dato{display:flex;align-items:center;gap:10px;padding:10px 16px}
.dato .lab{width:120px;flex:none;font:600 13px/17px var(--font)}
.dato .track{flex:1;height:10px;border-radius:5px;background:var(--fill);overflow:hidden}
.dato .track i{display:block;height:100%;background:var(--blanco);border-radius:5px}
[data-w]{transform:scaleX(0);transform-origin:left center}
[data-w].grown{transform:none;transition:transform .9s var(--spring)}
.dato .val{width:34px;text-align:right;font:800 14px/1 var(--font);font-variant-numeric:tabular-nums}
.empty{padding:22px 16px;text-align:center;color:var(--l2);font:500 14px/20px var(--font)}

/* Barra fija abajo: lo único que flota → cristal */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;width:calc(100% - 24px);max-width:520px;height:66px;border-radius:980px;
  display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;padding:0 6px;
  background:rgba(22,22,23,.72);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18),inset 0 1px 0 rgba(255,255,255,.12),0 12px 30px -10px rgba(0,0,0,.8)}
.tabbar .tb{height:54px;border-radius:980px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 10px/12px var(--font);letter-spacing:.04em;color:var(--l2);position:relative}
.tabbar .tb svg{width:24px;height:24px}
.tabbar .tb[aria-selected="true"]{color:var(--blanco)}
.tabbar .tb[aria-selected="true"]::after{content:"";position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--rojo)}
.tabbar .tb:active{opacity:.45}
.tabbar .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--rojo);color:#fff;font:800 10px/18px var(--font);padding:0 5px}
.fab{width:62px;height:62px;border-radius:50%;justify-self:center;background:var(--rojo);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px -6px rgba(0,0,0,.7);transition:filter .3s}
.fab:active{filter:brightness(.82);transition:none}
.fab svg{width:28px;height:28px}

/* Hoja (sheet) */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:60}
.dim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:61;width:100%;max-width:560px;max-height:calc(100% - 40px);background:#111;border-radius:30px 30px 0 0;display:flex;flex-direction:column;
  transform:translate(-50%,104%);transition:transform .45s ease-in;box-shadow:0 -10px 40px rgba(0,0,0,.6)}
.sheet.show{transform:translate(-50%,0);transition:transform .7s var(--spring)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--l3);margin:8px auto 2px;flex:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 4px var(--m);flex:none}
.sh-body{overflow-y:auto;padding:0 0 12px;scrollbar-width:none}
.sh-body::-webkit-scrollbar{display:none}
.sh-foot{flex:none;padding:12px var(--m) calc(16px + env(safe-area-inset-bottom));box-shadow:0 -.5px 0 var(--sep);background:#111}
.close{width:var(--tap);height:var(--tap);border-radius:50%;background:var(--card-2);font:700 18px/1 var(--font);color:var(--l2)}
.step{display:flex;gap:12px;padding:18px var(--m) 0}
.step .n{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font:900 13px/1 var(--font);background:var(--card-2);color:var(--l2);transition:background-color .3s,color .3s}
.step.done .n{background:var(--verde);color:#000}
.step .q{font:800 15px/20px var(--font);text-transform:uppercase;letter-spacing:.04em;margin:4px 0 10px}
.field{width:100%;border:0;border-radius:14px;background:var(--card-2);padding:12px 14px;font:500 16px/22px var(--font);outline:none;resize:none}
.field:focus{box-shadow:inset 0 0 0 2px var(--cyan)}
.field::placeholder{color:var(--l3)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:40px;border-radius:980px;padding:0 14px;background:var(--card-2);font:700 14px/1 var(--font);transition:background-color .25s}
.pill[aria-checked="true"]{background:var(--rojo);color:#fff}
.pill:active{opacity:.5;transition:none}
.st{font:600 13px/18px var(--font);padding-top:6px}
.st.ok{color:var(--verde)} .st.bad{color:var(--naranja)} .st.idle{color:var(--l3)}
.miss{font:700 13px/18px var(--font);color:var(--naranja);text-align:center;min-height:26px;padding-bottom:8px}
.menu-big{display:grid;gap:10px;padding:8px var(--m) 4px}
.menu-big button{display:flex;align-items:center;gap:14px;border-radius:20px;background:var(--card-2);padding:16px;text-align:left;min-height:72px}
.menu-big button:active{opacity:.5}
.menu-big .mi{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;background:var(--rojo-suave);color:var(--rojo)}
.menu-big .mi svg{width:24px;height:24px}

.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-14px);opacity:0;z-index:90;background:#2C2C2E;border-radius:980px;padding:11px 18px;font:700 14px/18px var(--font);white-space:nowrap;transition:transform .5s var(--spring),opacity .2s;pointer-events:none;max-width:92%}
.toast.show{transform:translate(-50%,0);opacity:1}
.skel{height:120px;margin:12px var(--m);border-radius:20px;background:linear-gradient(90deg,#0d0d0d 25%,#171717 50%,#0d0d0d 75%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
[hidden]{display:none!important}
.fab-l,.desk-col{display:none}
.l3{color:var(--l3)}

/* ================= ESCRITORIO (≥ 1024 px) =================
   Mismo color, letra y resortes. Cambia: barra lateral en vez de barra abajo,
   ficha como ventana centrada, hover en filas, controles más compactos. */
@media (min-width:1024px){
  :root{--m:24px;--side:232px}
  .top{padding:12px 28px 12px calc(var(--side) + 28px);z-index:45}
  .top img{position:fixed;left:28px;top:20px;height:34px}
  .top .live{margin-right:auto}
  .wrap{max-width:none;margin:0 0 0 var(--side);padding:0 12px 60px}
  .page-h{padding:28px var(--m) 4px}
  .h1{font-size:44px;line-height:48px}

  /* Barra lateral: lo único que flota → cristal */
  .tabbar{left:0;top:0;bottom:0;transform:none;width:var(--side);max-width:none;height:auto;border-radius:0;
    display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:84px 14px 20px;z-index:35;
    background:rgba(13,13,13,.78);box-shadow:inset -.5px 0 0 var(--borde)}
  .tabbar .tb{flex-direction:row;justify-content:flex-start;gap:12px;height:44px;padding:0 14px;border-radius:12px;font:700 14px/1 var(--font);letter-spacing:0}
  .tabbar .tb svg{width:20px;height:20px}
  .tabbar .tb[aria-selected="true"]{background:var(--card-2)}
  .tabbar .tb[aria-selected="true"]::after{bottom:auto;left:0;top:12px;width:3px;height:20px;border-radius:2px}
  .tabbar .badge{position:static;margin-left:auto;top:auto;left:auto}
  .fab{order:-1;width:100%;height:48px;border-radius:980px;display:flex;gap:8px;justify-content:center;margin-bottom:14px;font:800 15px/1 var(--font);text-transform:uppercase;letter-spacing:.04em}
  .fab svg{width:20px;height:20px}
  .fab-l{display:inline}

  /* Inicio en grilla */
  .dash{display:grid;grid-template-columns:repeat(12,1fr);gap:0 8px;align-items:start}
  .dash > section{min-width:0}
  .b-hero{grid-column:1 / span 7}
  .b-ficha{grid-column:8 / span 5}
  .b-ficha .sec{padding-top:12px}
  .b-alert{grid-column:1 / -1;order:3}
  .b-cats{grid-column:1 / span 6;order:4}
  .b-crea{grid-column:7 / span 6;order:5}
  .b-mes{grid-column:1 / span 6;order:6}
  .b-data{grid-column:7 / span 6;order:7}
  .b-hero{order:1}.b-ficha{order:2}
  .hero{padding:24px}
  .hero-n{font-size:88px}
  .mini-n{font-size:34px}
  .alerts{flex-wrap:wrap;overflow:visible}
  .alert{width:auto;flex:1 1 220px;max-width:none}

  /* Grupos en dos columnas */
  .groups{display:grid;grid-template-columns:1fr 1fr;gap:0 8px;align-items:start}
  .groups > section{min-width:0}

  /* Videos: más columnas */
  .search{max-width:640px}
  .desk-col{display:block;flex:none}
  .desk-desc{flex:1.4;min-width:0;font:500 13px/18px var(--font);color:var(--l2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .desk-est{width:96px;text-align:right}
  .groups .desk-col{display:none}

  /* Controles compactos (puntero preciso) */
  .ico,.arrow{width:36px;height:36px}
  .btn-sm{min-height:32px}
  .seg{max-width:360px}
  .nav-mes{max-width:none}

  /* Ficha: ventana centrada en vez de hoja desde abajo */
  .sheet{left:50%;top:50%;bottom:auto;width:600px;max-height:min(860px,calc(100vh - 64px));border-radius:24px;
    transform:translate(-50%,-48%) scale(.98);opacity:0;pointer-events:none;transition:transform .25s ease-in,opacity .2s ease-in}
  .sheet.show{transform:translate(-50%,-50%);opacity:1;pointer-events:auto;transition:transform .6s var(--spring),opacity .15s}
  .sheet .grab{display:none}
  .sh-head{padding:18px 14px 6px 24px}
  .sh-foot{padding:14px 24px 20px;border-radius:0 0 24px 24px}

async function apiGet(){
  const r=await fetch(SCRIPT_URL,{cache:'no-store'});const d=await r.json();
  if(d&&d.error)throw new Error(d.error);

  return d.filter(v=>v.id!=='CONFIG_NUBE');
}
// text/plain evita el preflight CORS que Apps Script no soporta
async function apiPost(action,payload){
  const r=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...payload})});
  if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();if(d.error)throw new Error(d.error);return d;
}

/* ===================== REGLAS (copiadas de la versión anterior) ===================== */
const CATEGORIES={'ESTUDIANTES':{color:'#448aff',prefix:'ES'},'DEMOSTRATIVAS':{color:'#c8ff00',prefix:'DM'},'ROMO ROOM':{color:'#e040fb',prefix:'RR'},'RELLENO':{color:'#888',prefix:'RLL'},'TESTIMONIOS':{color:'#ff6d00',prefix:'RDJ'},'VIDEOS 360':{color:'#1de9b6',prefix:'360'},'PEDRO ROMO':{color:'#ff4081',prefix:'PDR'},'MINISTERIO DE TRABAJO':{color:'#ffab00',prefix:'MDT'},'VIDEOS IA':{color:'#a78bfa',prefix:'IA'},'IA INFORMATIVO':{color:'#a78bfa',prefix:'IA'},'IA VIRAL':{color:'#ff1744',prefix:'IAV'},'IA EDICION DE AUDIO':{color:'#00e5ff',prefix:'IAE'},'IA MDT':{color:'#ffd600',prefix:'IAM'},'EDICION DE AUDIO':{color:'#26c6da',prefix:'EA'}};

const QUOTA_MENSUAL={DANIEL:40,TIPAN:40}; const META=20; const BUFFER_MIN=5;

function parseFecha(s){if(!s)return null;s=String(s).trim();if(/^\d{4}-\d{2}-\d{2}/.test(s)){const[y,m,d]=s.slice(0,10).split('-').map(Number);return new Date(y,m-1,d)}
  const meses={enero:0,febrero:1,marzo:2,abril:3,mayo:4,junio:5,julio:6,agosto:7,septiembre:8,setiembre:8,octubre:9,noviembre:10,diciembre:11},en={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  const parts=s.toLowerCase().replace(/de\s+/g,' ').replace(/[^a-z0-9\s]/g,' ').trim().split(/\s+/);let day=1,month=-1,year=-1,dayFound=false;
  parts.forEach(p=>{if(meses[p]!==undefined)month=meses[p];else if(en[p]!==undefined&&month===-1)month=en[p];else if(/^20\d\d$/.test(p)&&year===-1)year=+p;else if(/^\d{1,2}$/.test(p)&&!dayFound){day=+p;dayFound=true}});
  if(month===-1||year===-1)return null;return new Date(year,month,day)}
const isoDe=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const hoyIso=()=>isoDe(new Date());
const monthKey=(off=0)=>{const n=new Date(),t=new Date(n.getFullYear(),n.getMonth()+off,1);return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}`};
const vMonth=v=>{const d=parseFecha(v.fecha);return d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`:null};
const monthName=(off=0)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+off);return d.toLocaleString('es-ES',{month:'long',year:'numeric'})};
const fmtFecha=s=>{const d=parseFecha(s);return d?d.toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'2-digit'}).replace('.',''):(s||'—')};
const esArchivo=u=>!!u&&(u.includes('drive.google.com/uc')||u.includes('drive.google.com/file')||u.includes('/files/'));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const normCod=s=>String(s||'').toUpperCase().replace(/\s+/g,'');
const allCats=()=>[...new Set([...Object.keys(CATEGORIES).filter(c=>c!=='VIDEOS IA'),...videos.map(v=>v.categoria)])].filter(c=>c&&c!=='CONFIG');
/* Campaña: etiqueta opcional (MINISTERIO DE TRABAJO, EDICION DE AUDIO…). Antes era "tanda". */

function nextNumber(cat){const c=CATEGORIES[cat];if(!c)return null;const re=new RegExp('^'+c.prefix.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'0*(\\d+)$');let max=0,count=0;
  videos.forEach(v=>{const m=normCod(v.nombre).match(re);if(m){count++;max=Math.max(max,parseInt(m[1]))}});
  return{prefix:c.prefix,last:max,count,next:c.prefix+String(max+1).padStart(3,'0')}}

/* ===================== FICHA (nuevo · 12-10-2026) =====================

const OFERTAS=['Clase demo gratis','Inscripción al curso','Certificado MDT','Seguir la cuenta'];
const DESC_MIN=40; // menos que esto es una etiqueta (ROMO CAMBIOS pone la técnica), no la descripción publicada
const linkOk=u=>/tiktok\.com\/@[^/]+\/video\/\d{10,}|v[mt]\.tiktok\.com\/\w+/.test(u||'');
const firstLine=s=>((s||'').split('\n').find(l=>l.trim())||'').trim().toLowerCase();
const esDescReal=s=>(s||'').trim().length>=DESC_MIN;
// Etiquetas que ROMO CAMBIOS escribía en DESCRIPCION hasta el 12-10-2026. No son descripción: se limpian al guardar.

  const fl=firstLine(d),dup=videos.find(x=>x.id!==id&&esDescReal(x.descripcion)&&firstLine(x.descripcion)===fl);
  if(dup)return{ok:false,dup:true,msg:`Empieza igual que la de ${dup.nombre}. Cambia la primera línea para que Peter las distinga.`};return{ok:true,msg:'Descripción única ✓'}}
const fichaOk=(v,f)=>f==='tiktok'?linkOk(v.tiktok):f==='descripcion'?descState(v.descripcion,v.id).ok:!!v[f];
// Interruptor: tema/formato/oferta necesitan el Code.gs nuevo (Code-ficha-completa.gs) desplegado en Apps Script.

const stepHtml=(n,k,q,inner)=>`<div class="step" data-step="${k}"><span class="n">${n}</span><div class="grow"><div class="q">${q}</div>${inner}</div></div>`;
function fichaHtml(cur,tecnica){return `

  ${stepHtml(3,'formato','¿Cómo está hecho?',pillsHtml(FORMATOS,'formato',cur))}
  ${stepHtml(4,'oferta','¿Qué ofrece al final?',pillsHtml(OFERTAS,'oferta',cur))}`:''}
  ${stepHtml(FICHA_COMPLETA?5:2,'descripcion','Descripción tal cual se publicó',`<textarea class="field" id="f-ds" rows="5" placeholder="Pega el texto completo del post">${esc(cur.descripcion||'')}</textarea><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div class="st idle" id="s-ds"></div><button type="button" class="btn btn-gray btn-sm" id="f-dsp" style="margin-top:6px">Pegar</button></div>`)}`}

function rTanda(){
  const cats=allCats();
  $('#main').innerHTML=`<div class="page-h"><div class="kicker">Agregar</div><div class="h1">Tanda masiva</div></div>
    <p class="sub" style="padding:4px var(--m) 0">Registra muchos videos de un golpe. Un código por línea.</p>
    <div class="groups"><section><div class="card" style="margin-top:14px"><div class="form" style="padding:14px 16px 16px">
      <div class="f2"><label class="fl"><span>Categoría *</span><select class="field" id="t-cat">${optList(cats,'ESTUDIANTES')}</select></label>
      <label class="fl"><span>Estado</span><div class="seg seg-in" id="t-est"><i class="th"></i><button type="button" data-v="PENDIENTE" aria-pressed="${tandaEst==='PENDIENTE'}">Pendiente</button><button type="button" data-v="PUBLICADO" aria-pressed="${tandaEst==='PUBLICADO'}">Publicado</button></div></label></div>
      <div class="m" id="t-warn" style="color:var(--naranja)"></div>
      <div class="f2"><label class="fl"><span>Creador</span><input class="field" id="t-cre" list="dl-cre3" autocomplete="off" placeholder="MARLONT, DANIEL…"></label>
      <label class="fl"><span>Fecha de envío</span><input class="field" type="date" id="t-fec" value="${hoyIso()}"></label></div>
      <label class="fl"><span>Campaña (opcional)</span><input class="field" id="t-tan" list="dl-camp3" autocomplete="off" placeholder="MINISTERIO DE TRABAJO, EDICION DE AUDIO…"></label>${dlCamp('dl-camp3')}
      <label class="fl"><span>Códigos — uno por línea *</span><textarea class="field" id="t-cod" rows="9" placeholder="ES140\nES141\nES142"></textarea></label>
      <div style="display:flex;justify-content:space-between" class="m"><span id="t-count">0 videos</span><span id="t-next"></span></div>
      <button class="btn btn-red btn-wide" id="t-save" disabled>Registrar tanda</button>
    </div></div><datalist id="dl-cre3">${creadores().map(n=>`<option value="${esc(n)}">`).join('')}</datalist></section>
    <section><div class="sec"><h2>Vista previa</h2><span id="t-prev-n"></span></div><div class="card" id="t-prev"><div class="empty">Escribe los códigos y aquí ves cómo quedan</div></div></section></div>`;
  const seg=$('#t-est');segPlace(seg);seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{tandaEst=b.dataset.v;seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));segPlace(seg);updTanda()});
  ['t-cat','t-cod','t-cre'].forEach(id=>$('#'+id).addEventListener('input',updTanda));$('#t-cat').onchange=updTanda;$('#t-save').onclick=guardarTanda;updTanda();
}
function tandaCodigos(){const vistos=new Set();return($('#t-cod').value||'').split('\n').map(l=>l.trim()).filter(Boolean).map(c=>{const n=normCod(c),ex=videos.find(x=>normCod(x.nombre)===n),rep=vistos.has(n);vistos.add(n);return{c,ex,rep}})}
function updTanda(){
  const cat=$('#t-cat').value,list=tandaCodigos(),ok=list.filter(x=>!x.ex&&!x.rep),nx=nextNumber(cat);
  $('#t-count').textContent=`${ok.length} videos listos${list.length>ok.length?` · ${list.length-ok.length} se saltan`:''}`;
  $('#t-next').innerHTML=nx?`Siguiente: <b style="color:var(--blanco)">${nx.next}</b>`:'';
  $('#t-warn').textContent=tandaEst==='PUBLICADO'?'Como publicados quedan sin ficha: después hay que llenarla en "⚠ Sin ficha".':'';
  const col=catColor(cat);$('#t-prev-n').textContent=list.length?list.length+' códigos':'';
  $('#t-prev').innerHTML=list.length?list.map((x,i)=>`<div class="row"><span class="rank">${i+1}</span><span class="grow t" style="color:${col}">${esc(x.c)}</span>${x.ex?`<span class="tag org">Ya existe</span>`:x.rep?'<span class="tag org">Repetido</span>':`<span class="tag ${tandaEst==='PUBLICADO'?'ok':'gr'}">${tandaEst==='PUBLICADO'?'Publicado':'Pendiente'}</span>`}<span class="m">${esc($('#t-cre').value.trim().toUpperCase()||'—')}</span></div>`).join(''):'<div class="empty">Escribe los códigos y aquí ves cómo quedan</div>';
  $('#t-save').disabled=!cat||!ok.length;$('#t-save').textContent=ok.length?`Registrar ${ok.length} videos`:'Registrar tanda';
}
async function guardarTanda(){
  const cat=$('#t-cat').value,ok=tandaCodigos().filter(x=>!x.ex&&!x.rep),b=$('#t-save');if(!cat||!ok.length)return;
  const base=Date.now(),cre=$('#t-cre').value.trim().toUpperCase(),fec=$('#t-fec').value,tan=$('#t-tan').value.trim().toUpperCase();
  b.disabled=true;let n=0;
  for(const [i,x] of ok.entries()){b.textContent=`Guardando ${i+1} de ${ok.length}…`;
    const v={id:'v'+(base+i),campana:tan,fecha:fec,categoria:cat,nombre:x.c,estado:tandaEst,creador:cre,link:'',tiktok:'',notas:'',vistas:'',descripcion:'',tema:'',formato:'',oferta:''};
    if(await insertVideo(v)){videos.push(v);n++}}
  _hash=hashVideos(videos);toast(`✓ ${n} videos registrados — ahora súbelos a Drive 📤`);$('#t-cod').value='';updTanda();render();
}

/* ===================== GUÍA ===================== */
function rGuia(){
  const cats=Object.entries(CATEGORIES).filter(([n])=>n!=='VIDEOS IA');
  $('#main').innerHTML=`<div class="page-h"><div class="kicker">Para el equipo</div><div class="h1">Guía</div></div>
  <div class="groups">
  <section><div class="sec"><h2>1 · Regla de oro del nombre</h2></div><div class="card"><div class="row" style="display:block">
    <p class="m" style="color:var(--l2)">Cada video se llama con el <b style="color:var(--blanco)">código de su categoría + 3 números, todo pegado</b>. Ese nombre tiene que ser <b style="color:var(--blanco)">idéntico</b> al registrar en ROMO CONT y al exportar en CapCut: así el link de descarga funciona 100 %.</p>
    <div class="f2" style="margin-top:12px"><div class="guia-ok"><b class="tag ok">✅ Así sí</b><span>RLL085</span><span>ES140</span><span>DM037</span></div><div class="guia-ok bad"><b class="tag red">❌ Así no</b><span>RLL 085</span><span>RLL0085</span><span>RLL85</span></div></div>
    <p class="m" style="margin-top:10px">Sin espacios · siempre 3 números (nunca 4) · el mismo nombre en CapCut y en ROMO CONT</p></div></div></section>
  <section><div class="sec"><h2>3 · ¿Qué número me toca?</h2></div><div class="card"><div class="row" style="display:block">
    <p class="m">Antes de editar, mira cuál fue el último número de tu categoría:</p>
    <select class="field" id="g-cat" style="margin-top:10px"><option value="">Elige tu categoría…</option>${cats.map(([n,c])=>`<option value="${esc(n)}">${esc(n)} (${c.prefix})</option>`).join('')}</select>
    <div id="g-res" style="margin-top:12px"></div></div></div></section>
  <section><div class="sec"><h2>2 · Qué significa cada código</h2></div><div class="card">${cats.map(([n,c])=>`<div class="row"><span class="dot" style="background:${c.color}"></span><b class="t" style="width:52px;color:${c.color}">${c.prefix}</b><span class="m grow" style="color:var(--blanco)">${esc(n)}</span></div>`).join('')}</div></section>
  <section><div class="sec"><h2>4 · Cómo exportar en CapCut</h2></div><div class="card"><div class="row" style="display:block">
    <p class="m"><b style="color:var(--blanco)">Siempre</b> con esta configuración exacta:</p>
    <div class="cfg">${[['Resolución','1080P'],['Tasa de bits','Recomendado'],['Códec','H.264'],['Formato','mp4'],['FPS','30fps']].map(([a,b])=>`<div><span class="m">${a}</span><b>${b}</b></div>`).join('')}</div>
    <p class="t" style="margin-top:14px">📤 Se exporta 2 VECES el mismo video:</p>
    <div class="gstep"><span class="n" style="background:var(--cyan);color:#000">1</span><p class="m"><b style="color:var(--blanco)">Con voz</b>: la versión completa con el texto (técnica del cambio), el efecto en el cambio y el off "clase de DJ gratis para Quito". → Va a la carpeta <b style="color:var(--blanco)">VIDEOS LISTOS PARA SUBIR</b> del Drive.</p></div>
    <div class="gstep"><span class="n" style="background:var(--naranja);color:#000">2</span><p class="m"><b style="color:var(--blanco)">Sin voz</b>: el MISMO video pero quitando <b style="color:var(--blanco)">todo lo que diga "Quito"</b> (el off o cualquier texto). Sirve para cuando la academia se expanda a otras ciudades. → Se sube a la carpeta <b style="color:var(--blanco)">SIN VOZ</b>.</p></div>
  </div></div></section>
  <section><div class="sec"><h2>5 · Recursos y carpetas</h2></div><div class="card"><div class="row" style="display:block">
    <p class="m">Descarga los audios y recursos antes de editar, y ten a mano las carpetas de subida:</p>
    <div class="pills" style="margin-top:12px"><a class="btn btn-gray btn-sm" href="${AUDIOS_URL}" target="_blank" rel="noopener">🎵 Audios y recursos</a><a class="btn btn-gray btn-sm" href="${DRIVE_SINVOZ}" target="_blank" rel="noopener">📁 Carpeta SIN VOZ</a><a class="btn btn-gray btn-sm" href="${esc(NUBE_INBOX)}" target="_blank" rel="noopener">📤 Drive · listos para subir</a></div>
  </div></div></section>
  </div>`;
  $('#g-cat').onchange=e=>{const cat=e.target.value,r=cat&&nextNumber(cat),box=$('#g-res');if(!r){box.innerHTML='';return}
    box.innerHTML=`<div class="next-box"><div><div class="mini-l" style="margin:0">Te toca hacer</div><div class="mini-n" style="color:${catColor(cat)};font-size:30px">${r.next}</div></div><div class="m">${r.count?`Último registrado: <b style="color:var(--blanco)">${r.prefix}${String(r.last).padStart(3,'0')}</b><br>`:'Aún no hay videos con este formato<br>'}Exporta y nómbralo <b style="color:${catColor(cat)}">${r.next}</b></div></div>`};
}

/* ===================== BARRA DE ARRIBA ===================== */
function abrirDrive(){window.open(NUBE_INBOX||NUBE_INBOX_DEFAULT,'_blank')}
function abrirHoja(){window.open(HOJA_URL,'_blank')}
// Le pide al Apps Script que revise la carpeta de Drive y complete los links que falten
async function sincronizarDrive(){toast('Revisando la carpeta de Drive…');
  try{const r=await apiPost('drive',{});await recargar();toast(`✓ ${r.escritos||0} links nuevos · ${r.archivos||0} archivos en Drive`)}catch(e){toast('No se pudo sincronizar: '+e.message)}}

load();
</script>
